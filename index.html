<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="tool">
  <meta name="design-style" content="vitals">
  <title>논증 읽기와 체험 소감문 고쳐쓰기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;

      /* Page and surfaces (Vitals) */
      --background: #ffffff;
      --surface-container-low: #f1f7f8;
      --surface-container: #e3f1f3;
      --surface-container-high: #d5e9ec;

      /* Text */
      --on-surface: #1b2b33;
      --on-surface-variant: #46585f;

      /* Rules */
      --outline: #7b9198;
      --outline-variant: #d5e3e5;

      /* Accents */
      --primary: #0f7c8a;
      --primary-hover: #0b636f;
      --on-primary: #ffffff;
      --primary-container: #e3f1f3;
      --on-primary-container: #0a5560;
      --secondary: #1d5e3a;
      --tertiary: #2e7d4f;
      --tertiary-soft: #e7f4ec;
      --error: #b3261e;
      --error-soft: #fceceb;
      --on-error: #ffffff;

      /* Data & semantic */
      --data-1: #0f7c8a;
      --data-2: #2e7d4f;
      --data-3: #b86e00;
      --data-4: #5c5fb0;
      --data-context: #b8c7ca;
      --positive: #2e7d4f;
      --warning: #b86e00;
      --warning-soft: #fdf4e3;
      --focus: #0f7c8a;

      /* Fonts (Korean first) */
      --font-headline: 'Noto Sans KR', 'Figtree', sans-serif;
      --font-body: 'Noto Sans KR', 'Atkinson Hyperlegible', sans-serif;
      --font-label: 'Noto Sans KR', 'Figtree', sans-serif;

      /* Shape */
      --rounded: 0.625rem;
      --rounded-lg: 0.875rem;
      --rounded-full: 9999px;

      /* Style effects */
      --top-bar: 6px solid var(--primary);
      --status-bar-width: 4px;
      --card-border: 1px solid var(--outline-variant);
      --card-lift: 0 1px 2px rgb(27 43 51 / 0.05), 0 6px 16px rgb(27 43 51 / 0.05);

      /* Type scale */
      --display-size: clamp(1.5rem, 1.25rem + 1.1vw, 1.9rem);
      --headline-size: clamp(1.1875rem, 1.05rem + 0.5vw, 1.375rem);
      --subhead-size: clamp(1.02rem, 0.96rem + 0.25vw, 1.125rem);
      --body-size: clamp(0.9375rem, 0.9rem + 0.15vw, 1rem);
      --label-size: 0.78rem;

      /* Spacing scale */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
      --dur-long: 420ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      overflow-x: clip;
      margin: 0;
      padding: 0;
      background-color: var(--surface-container-low);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.6;
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select, textarea {
      font-family: inherit;
      letter-spacing: 0;
      text-transform: none;
    }

    header {
      position: static !important;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .app-shell {
      max-width: 680px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--background);
      border-top: var(--top-bar);
      border-left: var(--card-border);
      border-right: var(--card-border);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .app-header {
      padding: var(--space-md) var(--space-lg) var(--space-sm);
      border-bottom: var(--card-border);
      background-color: var(--background);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .header-kicker {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      color: var(--on-primary-container);
      background-color: var(--primary-container);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--rounded-full);
      display: inline-block;
      margin-bottom: var(--space-xs);
    }

    .app-title {
      font-family: var(--font-headline);
      font-size: var(--display-size);
      font-weight: 800;
      line-height: 1.15;
      margin: 0;
      color: var(--on-surface);
    }

    .student-badge {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 600;
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      background-color: var(--surface-container-low);
      border: var(--card-border);
      color: var(--on-surface-variant);
      white-space: nowrap;
    }

    /* Stepper Nav */
    .step-nav {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-lg);
      background-color: var(--surface-container-low);
      border-bottom: var(--card-border);
    }

    .step-btn {
      min-height: 44px;
      padding: var(--space-xs) var(--space-xs);
      border: var(--card-border);
      border-radius: var(--rounded);
      background-color: var(--background);
      color: var(--on-surface-variant);
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: background-color var(--dur-micro) var(--ease-out),
                  color var(--dur-micro) var(--ease-out),
                  box-shadow var(--dur-micro) var(--ease-out);
      text-align: center;
      line-height: 1.25;
    }

    .step-btn:hover {
      background-color: var(--surface-container);
    }

    .step-btn.active {
      background-color: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
      box-shadow: var(--card-lift);
    }

    .step-btn.done:not(.active) {
      border-color: var(--tertiary);
      color: var(--secondary);
      background-color: var(--tertiary-soft);
    }

    .step-btn.needs-fix:not(.active) {
      border-color: var(--error);
      color: var(--error);
      background-color: var(--error-soft);
    }

    .step-num {
      font-weight: 800;
      font-size: 0.72rem;
      opacity: 0.9;
    }

    .step-label {
      font-size: 0.73rem;
      word-break: keep-all;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
      padding-bottom: 5.5rem;
    }

    /* Cards & Status Accent Bars (Vitals signature) */
    .card {
      background-color: var(--background);
      border: var(--card-border);
      border-radius: var(--rounded-lg);
      padding: var(--space-lg);
      box-shadow: var(--card-lift);
    }

    .status-card {
      background-color: var(--background);
      border: var(--card-border);
      border-left: var(--status-bar-width) solid var(--primary);
      border-radius: var(--rounded-lg);
      padding: var(--space-md) var(--space-lg);
    }

    .status-card[data-status="ok"] {
      border-left-color: var(--tertiary);
    }

    .status-card[data-status="alert"] {
      border-left-color: var(--error);
    }

    .status-card[data-status="warn"] {
      border-left-color: var(--warning);
    }

    .section-title {
      font-family: var(--font-headline);
      font-size: var(--headline-size);
      font-weight: 800;
      margin: 0 0 var(--space-xs);
      line-height: 1.25;
      color: var(--on-surface);
    }

    .section-lede {
      margin: 0 0 var(--space-md);
      color: var(--on-surface-variant);
      font-size: var(--body-size);
      line-height: 1.55;
    }

    .sub-heading {
      font-family: var(--font-headline);
      font-size: var(--subhead-size);
      font-weight: 700;
      margin: 0 0 var(--space-sm);
      color: var(--on-surface);
    }

    /* Chips */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-label);
      font-weight: 600;
      font-size: var(--label-size);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      background-color: var(--tertiary-soft);
      color: var(--secondary);
    }

    .chip[data-status="info"] {
      background-color: var(--primary-container);
      color: var(--on-primary-container);
    }

    .chip[data-status="alert"] {
      background-color: var(--error-soft);
      color: var(--error);
    }

    .chip[data-status="warn"] {
      background-color: var(--warning-soft);
      color: var(--warning);
    }

    /* Buttons */
    .btn {
      min-height: 44px;
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--rounded);
      font-family: var(--font-label);
      font-size: var(--body-size);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      border: 1px solid transparent;
      transition: background-color var(--dur-micro) var(--ease-out),
                  color var(--dur-micro) var(--ease-out),
                  transform var(--dur-micro) var(--ease-out);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--on-primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--background);
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-secondary:hover {
      background-color: var(--surface-container-low);
    }

    .btn-ghost {
      background-color: var(--surface-container-low);
      color: var(--on-surface);
      border-color: var(--outline-variant);
    }

    .btn-ghost:hover {
      background-color: var(--surface-container);
    }

    .btn-block {
      width: 100%;
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      margin-bottom: var(--space-md);
    }

    .form-label {
      font-family: var(--font-label);
      font-weight: 700;
      font-size: var(--body-size);
      color: var(--on-surface);
    }

    .form-input {
      min-height: 46px;
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--outline);
      border-radius: var(--rounded);
      font-size: 1rem;
      color: var(--on-surface);
      background-color: var(--background);
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-container);
      outline: none;
    }

    .notice-box {
      background-color: var(--primary-container);
      color: var(--on-primary-container);
      border-left: var(--status-bar-width) solid var(--primary);
      border-radius: var(--rounded);
      padding: var(--space-md);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .error-msg {
      color: var(--error);
      background-color: var(--error-soft);
      border-left: var(--status-bar-width) solid var(--error);
      border-radius: var(--rounded);
      padding: var(--space-sm) var(--space-md);
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: var(--space-sm);
    }

    /* Passages & Touchable Sentences */
    .passage-box {
      background-color: var(--surface-container-low);
      border: var(--card-border);
      border-radius: var(--rounded-lg);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .passage-tag {
      font-family: var(--font-label);
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--on-primary-container);
      background-color: var(--primary-container);
      padding: 2px 10px;
      border-radius: var(--rounded-full);
      align-self: flex-start;
    }

    .passage-para {
      margin: 0;
      line-height: 1.75;
      font-size: 0.96rem;
      color: var(--on-surface);
    }

    .sent-touch {
      display: inline;
      padding: 2px 4px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color var(--dur-micro) var(--ease-out);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .sent-touch:hover {
      background-color: var(--surface-container);
    }

    .sent-touch.selected {
      background-color: var(--primary-container);
      color: var(--on-primary-container);
      font-weight: 600;
      box-shadow: inset 0 -2px 0 var(--primary);
    }

    .sent-touch.linked-ok {
      background-color: var(--tertiary-soft);
      color: var(--secondary);
      font-weight: 600;
      box-shadow: inset 0 -2px 0 var(--tertiary);
    }

    .inline-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary);
      color: var(--on-primary);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: var(--rounded-full);
      margin: 0 3px;
      vertical-align: middle;
    }

    /* Keyword & Role Grids */
    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-sm);
    }

    .choice-pill {
      min-height: 46px;
      padding: var(--space-sm) var(--space-md);
      border: var(--card-border);
      border-radius: var(--rounded);
      background-color: var(--background);
      color: var(--on-surface);
      font-size: 0.9rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      transition: background-color var(--dur-micro) var(--ease-out),
                  box-shadow var(--dur-micro) var(--ease-out);
    }

    .choice-pill:hover {
      background-color: var(--surface-container-low);
    }

    .choice-pill.selected {
      background-color: var(--primary-container);
      color: var(--on-primary-container);
      box-shadow: inset 0 0 0 2px var(--primary);
      font-weight: 700;
    }

    .choice-pill.correct {
      background-color: var(--tertiary-soft);
      color: var(--secondary);
      box-shadow: inset 0 0 0 2px var(--tertiary);
      font-weight: 700;
    }

    .choice-pill.wrong {
      background-color: var(--error-soft);
      color: var(--error);
      box-shadow: inset 0 0 0 2px var(--error);
    }

    /* Question Cards */
    .question-block {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .q-title {
      font-family: var(--font-headline);
      font-size: var(--subhead-size);
      font-weight: 800;
      margin: 0;
      line-height: 1.4;
      flex: 1;
    }

    .bogi-box {
      background-color: var(--surface-container-low);
      border: 1px solid var(--outline);
      border-radius: var(--rounded);
      padding: var(--space-md);
    }

    .bogi-title {
      text-align: center;
      font-weight: 800;
      font-size: 0.88rem;
      margin-bottom: var(--space-sm);
      letter-spacing: 0.12em;
      color: var(--on-surface);
    }

    .choice-item-card {
      border: var(--card-border);
      border-radius: var(--rounded);
      padding: var(--space-md);
      background-color: var(--background);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      transition: background-color var(--dur-micro) var(--ease-out),
                  box-shadow var(--dur-micro) var(--ease-out);
    }

    .choice-item-card.active-target {
      background-color: var(--surface-container-low);
      box-shadow: inset 0 0 0 2px var(--primary);
    }

    .choice-item-text {
      font-size: 0.94rem;
      line-height: 1.55;
      color: var(--on-surface);
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      align-items: center;
    }

    .toggle-btn {
      min-height: 44px;
      padding: var(--space-xs) var(--space-md);
      border: var(--card-border);
      border-radius: var(--rounded);
      background-color: var(--background);
      color: var(--on-surface);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
    }

    .toggle-btn:hover {
      background-color: var(--surface-container-low);
    }

    .toggle-btn.active-primary {
      background-color: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }

    .toggle-btn.active-warn {
      background-color: var(--warning);
      color: var(--on-primary);
      border-color: var(--warning);
    }

    .toggle-btn.active-ok {
      background-color: var(--tertiary);
      color: var(--on-primary);
      border-color: var(--tertiary);
    }

    .toggle-btn.active-err {
      background-color: var(--error);
      color: var(--on-error);
      border-color: var(--error);
    }

    /* Segmented Phrase Buttons */
    .segment-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      padding: var(--space-sm);
      background-color: var(--surface-container-low);
      border-radius: var(--rounded);
      border: var(--card-border);
    }

    .seg-btn {
      min-height: 44px;
      padding: var(--space-xs) var(--space-sm);
      border: 1px solid var(--outline-variant);
      border-radius: var(--rounded);
      background-color: var(--background);
      color: var(--on-surface);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      line-height: 1.35;
    }

    .seg-btn:hover {
      background-color: var(--surface-container);
    }

    .seg-btn.picked {
      background-color: var(--error-soft);
      color: var(--error);
      box-shadow: inset 0 0 0 2px var(--error);
      font-weight: 700;
    }

    /* Final Answer 1-5 Selector */
    .final-answer-box {
      background-color: var(--surface-container-low);
      border: var(--card-border);
      border-left: var(--status-bar-width) solid var(--primary);
      border-radius: var(--rounded);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .final-answer-title {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--on-surface);
      margin: 0;
    }

    .num-btn-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: var(--space-sm);
    }

    .num-btn {
      min-height: 46px;
      border: var(--card-border);
      border-radius: var(--rounded);
      background-color: var(--background);
      color: var(--on-surface);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .num-btn:hover {
      background-color: var(--surface-container);
    }

    .num-btn.selected {
      background-color: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }

    /* SNS Chat UI */
    .sns-window {
      background-color: var(--surface-container-low);
      border: var(--card-border);
      border-radius: var(--rounded-lg);
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .sns-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: var(--card-border);
      padding-bottom: var(--space-sm);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--on-surface-variant);
    }

    .chat-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 90%;
    }

    .chat-row.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .chat-sender {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--on-surface-variant);
    }

    .chat-bubble {
      background-color: var(--background);
      border: var(--card-border);
      border-radius: var(--rounded-lg);
      padding: var(--space-sm) var(--space-md);
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--on-surface);
    }

    .chat-row.me .chat-bubble {
      background-color: var(--primary-container);
      color: var(--on-primary-container);
      border-color: var(--primary);
    }

    .blank-pill {
      display: inline-block;
      padding: 1px 8px;
      border-radius: var(--rounded);
      background-color: var(--surface-container-high);
      font-weight: 800;
      color: var(--primary);
      border: 1px dashed var(--primary);
    }

    /* Step Footer Navigation */
    .step-footer {
      display: flex;
      justify-content: space-between;
      gap: var(--space-sm);
      padding-top: var(--space-md);
      border-top: var(--card-border);
    }

    /* Floating Return to Step 5 Button */
    .floating-return-btn {
      position: fixed;
      bottom: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      min-height: 48px;
      padding: var(--space-sm) var(--space-lg);
      border-radius: var(--rounded-full);
      background-color: var(--primary);
      color: var(--on-primary);
      border: 2px solid var(--background);
      box-shadow: 0 6px 20px rgb(15 124 138 / 0.35);
      font-family: var(--font-label);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      max-width: calc(100vw - 2rem);
      white-space: nowrap;
    }

    .floating-return-btn:hover {
      background-color: var(--primary-hover);
    }

    /* Score & Certificate */
    .score-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      flex-wrap: wrap;
    }

    .score-number {
      font-family: var(--font-headline);
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
    }

    .score-number.perfect {
      color: var(--tertiary);
    }

    .certificate-card {
      background-color: var(--background);
      border: 3px solid var(--primary);
      border-radius: var(--rounded-lg);
      padding: var(--space-xl) var(--space-lg);
      position: relative;
      box-shadow: var(--card-lift);
    }

    .cert-inner-frame {
      border: 1px solid var(--outline-variant);
      border-radius: var(--rounded);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .cert-seal {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      background-color: var(--tertiary-soft);
      color: var(--secondary);
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--rounded-full);
      font-weight: 700;
      font-size: var(--label-size);
      align-self: flex-start;
    }

    .cert-recipient {
      font-family: var(--font-headline);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--on-surface);
      border-bottom: 2px solid var(--primary);
      padding-bottom: var(--space-xs);
    }

    .cert-meta-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-sm);
      font-size: 0.88rem;
      color: var(--on-surface-variant);
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60;
    }

    /* Collapsible reference helper */
    .ref-drawer {
      border: var(--card-border);
      border-radius: var(--rounded);
      background-color: var(--surface-container-low);
      overflow: hidden;
    }

    .ref-drawer-btn {
      width: 100%;
      min-height: 44px;
      padding: var(--space-sm) var(--space-md);
      background-color: var(--surface-container-low);
      border: none;
      color: var(--on-primary-container);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .ref-drawer-body {
      padding: var(--space-md);
      border-top: var(--card-border);
      background-color: var(--background);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      .app-shell {
        border-left: none;
        border-right: none;
      }
      .app-header {
        padding: var(--space-md);
      }
      .step-nav {
        padding: var(--space-xs) var(--space-sm);
      }
      .main-content {
        padding: var(--space-md);
        padding-bottom: 5.5rem;
      }
      .card {
        padding: var(--space-md);
      }
      .option-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas" class="hidden" aria-hidden="true"></canvas>

  <div class="app-shell">
    <header class="app-header">
      <div class="header-top">
        <div>
          <span class="header-kicker">고등학교 국어 · 독서와 작문 미션</span>
          <h1 class="app-title">논증 읽기와 체험 소감문 고쳐쓰기</h1>
        </div>
        <div id="student-badge" class="student-badge hidden"></div>
      </div>
    </header>

    <nav id="step-nav" class="step-nav hidden" aria-label="미션 단계 이동">
      <button type="button" class="step-btn" data-step="1" onclick="goStep(1)">
        <span class="step-num">STEP 1</span>
        <span class="step-label">지문 워밍업</span>
      </button>
      <button type="button" class="step-btn" data-step="2" onclick="goStep(2)">
        <span class="step-num">STEP 2</span>
        <span class="step-label">독서 1~4번</span>
      </button>
      <button type="button" class="step-btn" data-step="3" onclick="goStep(3)">
        <span class="step-num">STEP 3</span>
        <span class="step-label">소감문 워밍업</span>
      </button>
      <button type="button" class="step-btn" data-step="4" onclick="goStep(4)">
        <span class="step-num">STEP 4</span>
        <span class="step-label">작문 5~7번</span>
      </button>
      <button type="button" class="step-btn" data-step="5" onclick="goStep(5)">
        <span class="step-num">STEP 5</span>
        <span class="step-label">결과·인증서</span>
      </button>
    </nav>

    <main id="app-main" class="main-content"></main>
  </div>

  <button type="button" id="floating-return-btn" class="floating-return-btn hidden" onclick="goStep(5)">
    결과 화면(스텝 5)으로 바로 돌아가기
  </button>

  <api-shim></api-shim>

  <script>
    // =========================================================================
    // 1. Source Data
    // =========================================================================
    const PASSAGE_GA = [
      { id: `ga1`, para: 1, text: `복지국가의 대표적인 할당 원리로 보편주의와 선별주의가 있다.` },
      { id: `ga2`, para: 1, text: `보편주의는 사회적 위험이나 질병 그리고 연령 등에 따라 사람들이 특정 욕구를 갖게 되었다고 판단될 때, 이러한 욕구를 가진 모든 사람에게 물품, 지원금 등의 급여를 제공하는 것이다.` },
      { id: `ga3`, para: 1, text: `이때 급여 대상자의 경제적 능력은 고려하지 않는다.` },
      { id: `ga4`, para: 1, text: `보편주의의 밑바탕에는 사회적 시민권이 자리 잡고 있다.` },
      { id: `ga5`, para: 1, text: `이에 의하면, 특정 욕구를 지닌 모두에게 급여가 지급되고, 사회 서비스에 대한 접근성도 보장된다.` },
      { id: `ga6`, para: 2, text: `한편, 선별주의는 사회적 위험이나 질병 그리고 연령 등에 따라 특정한 욕구를 지니게 된 자 중에 특정 기준에 부합하는 사람에게만 급여를 제공하는 것이다.` },
      { id: `ga7`, para: 2, text: `소득과 재산 정도에 따라 저소득층을 급여 대상자로 삼는 경우 등이 이에 해당한다.` },
      { id: `ga8`, para: 2, text: `선별주의는 자산 조사를 통해 저소득층을 가르는 것만을 뜻하지 않는다.` },
      { id: `ga9`, para: 2, text: `전문가의 진단에 의해 복지 자원을 할당하는 경우도 선별주의에 포함된다.` },
      { id: `ga10`, para: 2, text: `이때 대상자의 심리적 위축이나 근로 의욕 상실에 유의해야 한다.` }
    ];

    const PASSAGE_NA = [
      { id: `na1`, para: 1, text: `정책을 결정할 때에는 정책 수단과 정책 대안을 탐색해야 한다.` },
      { id: `na2`, para: 1, text: `정책 수단은 목표의 달성을 위한 개별적인 방법들이고, 정책 대안은 이 수단들을 다양하게 묶는 것을 말한다.` },
      { id: `na3`, para: 1, text: `예를 들어, 대도시의 교통을 원활히 하겠다는 목표를 달성하기 위해 당국자는 지하철 건설, 버스노선 신설, 또는 도로 확장 등 각각의 개별적인 정책 수단을 검토할 수 있다.` },
      { id: `na4`, para: 1, text: `또 지하철과 버스, 버스와 도로, 지하철과 버스와 도로처럼 개별적 수단을 다양한 방식으로 묶어 여러 정책 대안을 마련할 수 있다.` },
      { id: `na5`, para: 1, text: `정책 수단을 마련할 때에는 창의적 아이디어, 과거의 경험, 다른 지역이나 국가의 사례, 이론적인 연구 결과 등의 범위에서 탐색할 수 있다.` },
      { id: `na6`, para: 2, text: `제한된 예산의 범위 내에서 정책의 능률성과 효과성을 높일 수 있는 방향으로 정책 수단이나 정책 대안이 선택되어야 한다.` },
      { id: `na7`, para: 2, text: `이때 능률성은 투입 대비 산출의 비율을 의미하고, 효과성은 목표 달성의 정도를 의미한다.` },
      { id: `na8`, para: 2, text: `능률성과 효과성은 상충되는 경우도 있으므로 이에 유의해야 한다.` },
      { id: `na9`, para: 2, text: `능률성만 강조하면 예산은 절약할 수 있으나 목표에 미도달할 수 있고, 효과성만 강조하면 목표는 달성할 수 있으나 예산이 과도하게 낭비될 수 있다.` }
    ];

    // [A] marker removed from da10 for Q3 passage display
    const PASSAGE_DA = [
      { id: `da1`, para: 1, text: `시청 공청회에서 내년 ‘청년 1인 월세 가구에 대한 월세 지원금 지급 방안’에 대한 의견 대립이 첨예하여 정책 결정이 미뤄졌다.` },
      { id: `da2`, para: 1, text: `청년 주거비 지원 예산 내에서 주거비 경감의 목표를 달성하기 위해 청년 1인 월세 가구 모두에게 동일한 금액을 지급하자는 방안과 경제적으로 더 어려운 청년들을 선별하여 차등 지급하자는 방안으로 대립했다.` },
      { id: `da3`, para: 1, text: `청년 1인 월세 가구 모두에게 지원금을 제공하면 근로 의욕 상실과 같은 부작용 없이 사회적 시민권을 보장해 줄 수 있기 때문에 나는 전자에 찬성한다.` },
      { id: `da4`, para: 2, text: `그 근거로 첫째, 지원받은 청년들의 삶의 질에 대한 만족도를 높일 수 있다.` },
      { id: `da5`, para: 2, text: `▢▢시 정책연구소의 만족도 조사 결과를 보면, ▢▢시는 최근 2년간 모든 청년 1인 월세 가구에 지원금을 지급했는데, 지원받은 대부분의 청년이 삶의 질 향상에 도움을 받았다고 응답했다.` },
      { id: `da6`, para: 2, text: `또 서류 미비 등으로 실제 지원 대상에서 누락되는 것을 막아 청년들의 만족도가 높았다고 한다.` },
      { id: `da7`, para: 2, text: `둘째, 사회 통합에 기여할 수 있다.` },
      { id: `da8`, para: 2, text: `사회복지 전문가 박○○ 교수는 해당 청년 모두에게 지원금을 지급하지 않고 경제력에 따라 일부 청년층에게만 차등 지급한다면, 수혜자와 비수혜자 사이에 갈등이 유발될 수 있다고 말했다.` },
      { id: `da9`, para: 3, text: `물론 부유한 청년에게도 지원할 경우, 실제 지원이 필요한 청년들에게 지원되는 금액이 줄어들기 때문에 정책의 효과성이 떨어진다며 반대할 수 있다.` },
      { id: `da10`, para: 3, text: `그러나 이 방안은 소득, 자산 수준 등의 자격 심사를 포함한 여러 행정 비용이 절약되어 이를 지원금으로 전환할 수 있으므로 더 능률성 있는 정책 수단이다.` },
      { id: `da11`, para: 4, text: `따라서 모든 청년 1인 월세 가구에 균등하게 지원금을 지급하는 것에 찬성한다.` }
    ];

    const PASSAGE_RA = [
      {
        id: `p1`,
        num: 1,
        text: `얼마 전 가족들에게 내가 직접 만든 도자기 작품을 선물하면 좋겠다는 생각에 도자기 공예 체험 프로그램에 참여하였다. 가족들을 생각하며 신청한 것이지만, 돌이켜 보니 그 시간은 나 스스로에게 주는 선물이기도 했다.`,
        summary: `도자기 공예 체험에 참여하게 된 계기 (가족에게 줄 선물)`
      },
      {
        id: `p2`,
        num: 2,
        text: `공방에 처음 갔던 날 공예가 선생님께서는 도자기 공예에 쓰이는 흙의 종류를 설명해 주셨다. 공예에 쓰이는 흙에는 백자토, 황토, 석기토 등이 있는데 백자토는 발색이 뛰어나지만 모양 변형이 어렵고, 황토는 철분 함량이 높고 열을 가한 후에는 어두운 색을 띠기도 한다. 석기토는 상대적으로 모양 변형이 쉽고 내구성이 강하다. 이번 체험에서는 석기토를 사용하기로 했다.`,
        summary: `공예에 쓰이는 흙의 종류 구분과 석기토 선택`
      },
      {
        id: `p3`,
        num: 3,
        text: `첫 번째 활동은 ‘물레 성형 기법’을 활용한 꽃병 제작이었다. 물레 성형 기법이란 물레 위에 점토를 올려놓고 물레의 속도를 조절하면서 둥근 형태의 도자기를 빚는 기법이다. 직접 손으로 물레를 돌리는 전통 물레와 전동 모터로 회전하는 전기 물레 중 전기 물레로 체험을 진행하였다. 선생님의 시범을 볼 때와 달리, 조금만 손에 힘을 주어도 흙이 아래로 주저앉거나 찌그러져 계획한 대로 모양을 잡기 어려웠다. 선생님은 흙이 중심을 잡을 수 있도록 손에 힘을 빼고 천천히 모양을 다듬으라고 하셨다. 그래서 흙이 중심을 잡고 돌아가도록 부드럽게 감싸주었더니 제법 꽃병의 형태가 만들어졌다.`,
        summary: `물레 성형 기법으로 꽃병 만들기와 선생님의 조언으로 문제 해결`
      },
      {
        id: `p4`,
        num: 4,
        text: `다음으로 ‘흙가래 성형 기법’을 활용해 컵을 만드는 활동을 했다. 흙가래 성형 기법은 점토를 가래떡처럼 길게 늘여 밑판에서부터 한층 한층 쌓아 올리는 기법이다. 선생님께서는 컵의 하단부에 해당하는 흙가래는 약간 굵게 만들어야 한다고 하셨다. 이유를 물었더니, 그 점토들이 물건의 받침 역할을 하기 때문이라고 말씀하셨다. 물레 없이 손으로 직접 만들었더니 모양이 정교하지 않고 삐뚤빼뚤했지만, 나만의 손자국이 남은 작품이라고 생각하니 보람찼다.`,
        summary: `흙가래 성형 기법으로 컵 만들기와 하단부 두께를 굵게 한 이유`
      },
      {
        id: `p5`,

          keywords: { g1: null, g2: null, n1: null, n2: null }
        },
        step2: {
          q1: {
            activeChoice: `1`,
            verdicts: { '1': null, '2': null, '3': null, '4': null, '5': null },
            sentences: { '1': [], '2': [], '3': [], '4': [], '5': [] },
            answer: null
          },
          q2: {
            ox: { '1': null, '2': null, '3': null, '4': null, '5': null },
            wrongSegs: { '1': [], '2': [], '3': [], '4': [], '5': [] },
            answer: null
          },
          q3: {
            activeChoice: `1`,
            links: { '1': [], '2': [], '3': [], '4': [], '5': [] },
            answer: null
          },
          q4: {
            passageChoice: null,
            answer: null
          }
        },
        step3: {
          cardOrder: shuffleIndices(6),
          selectedCard: null,
          matches: { p1: null, p2: null, p3: null, p4: null, p5: null, p6: null },
          expandedPara: { p1: true, p2: false, p3: false, p4: false, p5: false, p6: false }
        },
        step4: {
          q5: {
            ox: { '1': null, '2': null, '3': null, '4': null, '5': null },
            wrongSegs: { '1': null, '2': null, '3': null, '4': null, '5': null },
            answer: null
          },
          q6: {
            ox: { '1': null, '2': null, '3': null, '4': null, '5': null },
            wrongSegs: { '1': null, '2': null, '3': null, '4': null, '5': null },
            answer: null
          },
          q7: {
            deletedSentence: null,
            addedOption: null,
            aChoice: null,
            bChoice: null,
            answer: null
          }
        }
      };
    }

    let appState = createInitialState();
    let confettiAnimId = null;

    async function persistState() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === `function`) {
          await window.notebookAppApi.setAppState(appState);
        }
      } catch (e) {
        // Ignore persistence errors silently in offline preview
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, `&amp;`)
        .replace(/</g, `&lt;`)
        .replace(/>/g, `&gt;`)
        .replace(/"/g, `&quot;`)
        .replace(/'/g, `&#39;`);
    }

    // =========================================================================
    // 3. Evaluation & Grading Engine
    // =========================================================================
    function arraysMatchExact(arrA, arrB) {
      if (!Array.isArray(arrA) || !Array.isArray(arrB)) return false;
      if (arrA.length !== arrB.length) return false;
      const sA = arrA.slice().sort();
      const sB = arrB.slice().sort();
      for (let i = 0; i < sA.length; i++) {
        if (sA[i] !== sB[i]) return false;
      }
      return true;
    }

    function evaluateMission() {
      const issuesByStep = { 1: [], 2: [], 3: [], 4: [] };
      let earned = 0;
      let total = 0;

      // Step 1: 4 keywords ((가) 1·2문단, (나) 1·2문단) = 4
      STEP1_KEYWORDS.forEach(function (item) {
        total += 1;
        if (appState.step1.keywords[item.key] === 0) {
          earned += 1;
        } else {
          issuesByStep[1].push(`${item.title} 선택 확인 필요`);
        }
      });

      // Step 2:
      // Q1: 5 choice verifications + 1 final answer = 6
      let q1SubOk = true;
      Q1_CHOICES.forEach(function (ch) {
        total += 1;
        const v = appState.step2.q1.verdicts[ch.id];
        const s = appState.step2.q1.sentences[ch.id] || [];
        if (v === ch.correctVerdict && arraysMatchExact(s, ch.correctSentences)) {
          earned += 1;
        } else {
          q1SubOk = false;
          issuesByStep[2].push(`1번 문항 ${ch.id}번 선지 판별/근거 문장 확인 필요`);
        }
      });
      total += 1;
      const q1AnsOk = appState.step2.q1.answer === `3`;
      if (q1AnsOk) {
        earned += 1;
      } else {
        issuesByStep[2].push(`1번 문항 최종 정답 확인 필요`);
      }

      // Q2: 5 O/X + 4 wrong segment checks on X choices + 1 final answer = 10
      let q2SubOk = true;
      Q2_CHOICES.forEach(function (ch) {
        total += 1;
        const ox = appState.step2.q2.ox[ch.id];
        if (ox === ch.correctOX) {
          earned += 1;
        } else {
          q2SubOk = false;
          issuesByStep[2].push(`2번 문항 ${ch.id}번 선지 적절/부적절 판별 확인 필요`);
        }
        if (ch.correctOX === `X`) {
          total += 1;
          const picked = appState.step2.q2.wrongSegs[ch.id] || [];
          if (ox === `X` && arraysMatchExact(picked, ch.wrongSegIndices)) {
            earned += 1;
          } else {
            q2SubOk = false;
            issuesByStep[2].push(`2번 문항 ${ch.id}번 선지 오류 구절 짚기 확인 필요`);
          }
        }
      });
      total += 1;
      const q2AnsOk = appState.step2.q2.answer === `1`;
      if (q2AnsOk) {
        earned += 1;
      } else {
        issuesByStep[2].push(`2번 문항 최종 정답 확인 필요`);
      }

      // Q3: 5 sentence links + 1 final answer = 6
      let q3LinksOk = true;
      Q3_CHOICES.forEach(function (ch) {
        total += 1;
        const linked = appState.step2.q3.links[ch.id] || [];
        const hasValid = linked.some(function (sid) {
          return ch.validSentences.indexOf(sid) !== -1;
        });
        if (hasValid) {
          earned += 1;
        } else {
          q3LinksOk = false;
          issuesByStep[2].push(`3번 문항 ${ch.id}번 선지와 (다) 본문 문장 연결 확인 필요`);
        }
      });
      total += 1;
      const q3AnsOk = appState.step2.q3.answer === `5`;
      if (q3AnsOk) {
        earned += 1;
      } else {
        issuesByStep[2].push(`3번 문항 최종 정답 확인 필요`);
      }

      // Q4: 1단계 passage ('na') + 2단계 answer ('5') = 2
      total += 1;
      const q4Stage1Ok = appState.step2.q4.passageChoice === `na`;
      if (q4Stage1Ok) {
        earned += 1;
      } else {
        issuesByStep[2].push(`4번 문항 1단계 연결 지문 선택 확인 필요`);
      }
      total += 1;
      const q4AnsOk = appState.step2.q4.answer === `5`;
      if (q4AnsOk) {
        earned += 1;
      } else {
        issuesByStep[2].push(`4번 문항 최종 정답 확인 필요`);
      }

      // Step 3: 6 paragraph matches = 6
      PASSAGE_RA.forEach(function (para, idx) {
        total += 1;
        if (appState.step3.matches[para.id] === idx) {
          earned += 1;
        } else {
          issuesByStep[3].push(`(라) ${para.num}문단 중심 내용 연결 확인 필요`);
        }
      });

      // Step 4:
      // Q5: 5 O/X + choice 3 wrong segment (idx 2) + final answer ('3') = 6
      let q5SubOk = true;
      Q5_CHOICES.forEach(function (ch) {
        total += 1;
        const ox = appState.step4.q5.ox[ch.id];
        if (ox === ch.correctOX) {
          if (ch.correctOX === `X`) {
            if (appState.step4.q5.wrongSegs[ch.id] === ch.wrongSegIdx) {
              earned += 1;
            } else {
              q5SubOk = false;
              issuesByStep[4].push(`5번 문항 ${ch.id}번 선지 틀린 구절 하이라이트 필요`);
            }
          } else {
            earned += 1;
          }
        } else {
          q5SubOk = false;
          issuesByStep[4].push(`5번 문항 ${ch.id}번 선지 적절/부적절 판별 확인 필요`);
        }
      });
      total += 1;
      const q5AnsOk = appState.step4.q5.answer === `3`;
      if (q5AnsOk) {
        earned += 1;
      } else {
        issuesByStep[4].push(`5번 문항 최종 정답 확인 필요`);
      }

      // Q6: 5 O/X + 4 wrong segments on X choices + final answer ('2') = 10
      let q6SubOk = true;
      Q6_CHOICES.forEach(function (ch) {
        total += 1;
        const ox = appState.step4.q6.ox[ch.id];
        if (ox === ch.correctOX) {
          earned += 1;
        } else {
          q6SubOk = false;
          issuesByStep[4].push(`6번 문항 ${ch.id}번 선지 적절/부적절 판별 확인 필요`);
        }
        if (ch.correctOX === `X`) {
          total += 1;
          if (ox === `X` && appState.step4.q6.wrongSegs[ch.id] === ch.wrongSegIdx) {
            earned += 1;
          } else {
            q6SubOk = false;
            issuesByStep[4].push(`6번 문항 ${ch.id}번 선지 틀린 부분 선택 확인 필요`);
          }
        }
      });
      total += 1;
      const q6AnsOk = appState.step4.q6.answer === `2`;
      if (q6AnsOk) {
        earned += 1;
      } else {
        issuesByStep[4].push(`6번 문항 최종 정답 확인 필요`);
      }

// Q7: deletedSentence ('s2') + addedOption ('a2') + final answer ('2') = 3
        total += 1;
        const q7DelOk = appState.step4.q7.deletedSentence === `s2`;
        if (q7DelOk) {
            earned += 1;
        } else {
            issuesByStep[4].push(`7번 문항 초고 6문단 삭제할 문장 선택 확인 필요`);
        }

        total += 1;
        const q7AddOk = appState.step4.q7.addedOption === `a2`;
        if (q7AddOk) {
            earned += 1;
        } else {
            issuesByStep[4].push(`7번 문항 고친 글 6문단 추가할 문장 선택 확인 필요`);
        }

        total += 1;
        const q7AnsOk = appState.step4.q7.answer === `2`;
        if (q7AnsOk) {
            earned += 1;
        } else {
            issuesByStep[4].push(`7번 문항 최종 답 확정 확인 필요`);
        }

      const accuracy = total > 0 ? Math.round((earned / total) * 100) : 0;

      return {
        earned: earned,
        total: total,
        accuracy: accuracy,
        issuesByStep: issuesByStep,
        qFlags: {
                q1: q1SubOk && q1AnsOk,
                q2: q2SubOk && q2AnsOk,
                q3: q3LinksOk && q3AnsOk,
                q4: q4Stage1Ok && q4AnsOk,
                q5: q5SubOk && q5AnsOk,
                q6: q6SubOk && q6AnsOk,
                q7: q7DelOk && q7AddOk && q7AnsOk
            }
      };
    }

    // =========================================================================
    // 4. Navigation & Rendering Dispatcher
    // =========================================================================
    function updateHeaderAndNav(evalResult) {
      const badge = document.getElementById(`student-badge`);
      const nav = document.getElementById(`step-nav`);
      const floatBtn = document.getElementById(`floating-return-btn`);

      if (!appState.started) {
        if (badge) badge.classList.add(`hidden`);
        if (nav) nav.classList.add(`hidden`);
        if (floatBtn) floatBtn.classList.add(`hidden`);
        return;
      }

      if (nav) nav.classList.remove(`hidden`);

      if (badge) {
        if (sessionIdentity.destroyed) {
          badge.textContent = `개인정보 파기 완료`;
          badge.classList.remove(`hidden`);
        } else if (sessionIdentity.studentId || sessionIdentity.studentName) {
          badge.textContent = `${sessionIdentity.studentId} ${sessionIdentity.studentName}`.trim();
          badge.classList.remove(`hidden`);
        } else {
          badge.classList.add(`hidden`);
        }
      }

      if (floatBtn) {
        if (appState.hasVisitedResults && appState.currentStep !== 5) {
          floatBtn.classList.remove(`hidden`);
        } else {
          floatBtn.classList.add(`hidden`);
        }
      }

      const buttons = document.querySelectorAll(`.step-btn`);
      buttons.forEach(function (btn) {
        const s = Number(btn.getAttribute(`data-step`));
        btn.classList.remove(`active`, `done`, `needs-fix`);
        if (s === appState.currentStep) {
          btn.classList.add(`active`);
        } else if (s <= 4 && evalResult) {
          if (evalResult.issuesByStep[s].length === 0) {
            btn.classList.add(`done`);
          } else if (appState.hasVisitedResults) {
            btn.classList.add(`needs-fix`);
          }
        }
      });
    }

    function goStep(stepNum) {
      appState.currentStep = stepNum;
      if (stepNum === 5) {
        appState.hasVisitedResults = true;
      } else {
        stopConfetti();
      }
      persistState();
      renderApp();
      window.scrollTo({ top: 0, behavior: `smooth` });
    }

    function renderApp() {
      const main = document.getElementById(`app-main`);
      if (!main) return;

      const evalResult = evaluateMission();
      updateHeaderAndNav(evalResult);

      if (!appState.started) {
        main.innerHTML = renderStartScreen();
        return;
      }

      if (appState.currentStep === 1) {
        main.innerHTML = renderStep1(evalResult);
      } else if (appState.currentStep === 2) {
        main.innerHTML = renderStep2(evalResult);
      } else if (appState.currentStep === 3) {
        main.innerHTML = renderStep3(evalResult);
      } else if (appState.currentStep === 4) {
        main.innerHTML = renderStep4(evalResult);
      } else {
        main.innerHTML = renderStep5(evalResult);
        if (evalResult.accuracy === 100) {
          startConfetti();
        }
      }
    }

    // =========================================================================
    // 5. Start Screen (학번 / 이름 입력)
    // =========================================================================
    function renderStartScreen() {
      return `
        <section class="card">
          <span class="chip" data-status="info">수업 미션 시작</span>

          <p class="section-lede">
            독서 논증 지문 분석(1~4번)과 도자기 공예 체험 소감문 고쳐쓰기(5~7번) 미션을 순서대로 수행합니다.
            정확도 100%를 달성하면 완수 인증서가 발급됩니다.
          </p>

          <div class="form-group">
            <label for="input-student-id" class="form-label">학번</label>

              type="text"
              id="input-student-id"
              class="form-input"
              inputmode="numeric"

            <input
              type="text"
              id="input-student-name"
              class="form-input"
              maxlength="20"
              placeholder="예: 김국어"
              value="${escapeHtml(sessionIdentity.studentName)}"
            >
          </div>

          <div class="notice-box">
            학번 및 이름은 미션 완료 후 파기되며 저장되지 않습니다.
          </div>

          <div id="start-error" class="error-msg hidden"></div>

          <div style="margin-top: var(--space-lg);">
            <button type="button" class="btn btn-primary btn-block" onclick="handleStartMission()">
              미션 시작하기 (스텝 1로 이동)
            </button>
          </div>
        </section>

        <section class="status-card" data-status="info">
          <h3 class="sub-heading">미션 구성 안내</h3>
          <p style="margin: 0; font-size: 0.92rem; color: var(--on-surface-variant);">
            <strong>STEP 1</strong> (가)·(나) 지문 워밍업 →
            <strong>STEP 2</strong> 독서 1~4번 추론 풀이 →
            <strong>STEP 3</strong> (라) 소감문 워밍업 →
            <strong>STEP 4</strong> 작문 5~7번 고쳐쓰기 →
            <strong>STEP 5</strong> 채점 및 완수 인증서

        </section>
      `;
    }

    function handleStartMission() {
      const idEl = document.getElementById(`input-student-id`);
      const nameEl = document.getElementById(`input-student-name`);
      const errEl = document.getElementById(`start-error`);

      const sid = idEl ? idEl.value.trim() : ``;
      const sname = nameEl ? nameEl.value.trim() : ``;

      if (!sid || !sname) {
        if (errEl) {
          errEl.textContent = `학번과 이름을 모두 입력해 주세요. 입력하지 않으면 인증서 성명이 표시되지 않습니다.`;
          errEl.classList.remove(`hidden`);
        }
        return;
      }

      sessionIdentity.studentId = sid;
      sessionIdentity.studentName = sname;
      sessionIdentity.destroyed = false;
      appState.started = true;
      appState.currentStep = 1;
      persistState();
      renderApp();
      window.scrollTo({ top: 0, behavior: `smooth` });
    }

    // =========================================================================
    // 6. Step 1: 지문 워밍업 ((가), (나) 원문 읽기 및 문단별 핵심 키워드 선택)
    // =========================================================================
    function renderStep1(evalResult) {
      let html = `
        <section class="status-card" data-status="${evalResult.issuesByStep[1].length === 0 ? `ok` : `info`}">
          <div class="q-header">
            <div>
              <span class="chip" data-status="info">STEP 1 · 지문 워밍업</span>
              <h2 class="section-title" style="margin-top: var(--space-xs);">(가), (나) 지문 읽기와 핵심 파악하기</h2>
            </div>
          </div>
          <p class="section-lede" style="margin-bottom: 0;">
            제시문 (가)와 (나)의 각 문단 원문을 꼼꼼히 읽고, 각 문단의 핵심 개념 키워드를 선택해 보세요.
          </p>
        </section>

        <section class="card">
          <h3 class="sub-heading">(가), (나) 문단별 핵심 키워드 선택</h3>
      `;

      STEP1_KEYWORDS.forEach(function (item) {
        const order = appState.step1.keywordOrder[item.key] || [0, 1, 2, 3];
        const chosen = appState.step1.keywords[item.key];
        const isPicked = chosen !== null;

        const sourceArr = item.group === `ga` ? PASSAGE_GA : PASSAGE_NA;
        const fullParagraphText = sourceArr
          .filter(function (s) { return s.para === item.para; })
          .map(function (s) { return s.text; })
          .join(` `);

        html += `
          <div class="choice-item-card" style="margin-bottom: var(--space-md);">
            <div class="q-header">
              <strong style="font-size: 0.96rem;">${escapeHtml(item.title)}</strong>
              ${isPicked ? `<span class="chip" data-status="ok">선택 완료</span>` : `<span class="chip" data-status="info">선택 대기</span>`}
            </div>
            <div class="passage-box">
              <p class="passage-para">${escapeHtml(fullParagraphText)}</p>
            </div>
            <div class="option-grid">
        `;

        order.forEach(function (origIdx) {
          let cls = `choice-pill`;
          if (chosen === origIdx) {
            cls += ` selected`;
          }
          html += `
            <button type="button" class="${cls}" onclick="pickStep1Keyword('${item.key}', ${origIdx})">
              <span>${escapeHtml(item.options[origIdx])}</span>
            </button>
          `;
        });

        html += `</div>`;
        html += `</div>`;
      });
      html += `</section>`;

      html += `
        <div class="step-footer">
          <span></span>
          <button type="button" class="btn btn-primary" onclick="goStep(2)">
            다음: 스텝 2 (독서 1~4번) →
          </button>
        </div>
      `;

      return html;
    }

    function pickStep1Keyword(key, origIdx) {
      appState.step1.keywords[key] = origIdx;
      persistState();
      renderApp();
    }

    // =========================================================================
    // 7. Step 2: 독서 1~4번 문제
    // =========================================================================
    function renderPassageForQ1(groupName, passageArr, headerLabel) {
      const activeId = appState.step2.q1.activeChoice;
      const activeChoiceObj = Q1_CHOICES.find(function (c) { return c.id === activeId; });
      const activeInThisGroup = activeChoiceObj && activeChoiceObj.group === groupName && appState.step2.q1.verdicts[activeId] === `possible`;

      let html = `<div class="passage-box">`;
      html += `<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:var(--space-xs);">`;
      html += `<span class="passage-tag">${escapeHtml(headerLabel)}</span>`;
      if (activeInThisGroup) {
        const pickedLen = (appState.step2.q1.sentences[activeId] || []).length;
        html += `<span class="chip" data-status="info">${activeId}번 선지 근거 문장 터치 중 (현재 ${pickedLen}개 선택됨)</span>`;
      } else {
        html += `<span style="font-size:0.8rem; color:var(--on-surface-variant);">위 선지에서 [확인 가능]을 누른 뒤 문장을 터치하세요</span>`;
      }
      html += `</div>`;

      const paras = [1, 2];
      paras.forEach(function (pNum) {
        const sents = passageArr.filter(function (s) { return s.para === pNum; });
        html += `<p class="passage-para">`;
        sents.forEach(function (s) {
          const linkedChoices = Q1_CHOICES.filter(function (c) {
            return c.group === groupName && (appState.step2.q1.sentences[c.id] || []).indexOf(s.id) !== -1;
          });
          const isSelectedForActive = activeInThisGroup && (appState.step2.q1.sentences[activeId] || []).indexOf(s.id) !== -1;

                  ${selectedAddObj

                    : `<span style="color: var(--on-primary-container); font-weight: 600;">[위 오른쪽 카드에서 추가할 문장을 먼저 선택하세요]</span>`}
                  라는 문장으로 <span class="blank-pill">ⓑ ${escapeHtml(q7State.bChoice || `___________`)}</span> 덧붙여서 마무리 문단을 고쳐 쓸게요!
                </div>
              </div>
            </div>
          </div>

         
          <!-- 최종 답 확정 -->
          <div class="final-answer-box">
            <p class="final-answer-title">최종 답 확정: ⓐ, ⓑ 조합으로 가장 적절한 선지는?</p>
            <div style="display:flex; flex-direction:column; gap:var(--space-xs);">
              ${Q7_CHOICES.map(function (ch) {
                const isSel = q7State.answer === ch.id;
                return `
                  <button type="button" class="choice-pill ${isSel ? `selected` : ``}" onclick="setQ7Answer('${ch.id}')">
                    <span><strong>${ch.id}</strong> &nbsp; ⓐ ${escapeHtml(ch.a)} &nbsp;/&nbsp; ⓑ ${escapeHtml(ch.b)}</span>
                  </button>
                `;
              }).join(``)}
            </div>
          </div>
      `;

      if (showFixAlerts && !evalResult.qFlags.q7) {
        html += `<div class="error-msg">7번 문항 확인: 도자기가 잘 깨어지는 한계는 글의 흐름에서 벗어나므로 삭제하고, 1문단 체험 계기(가족에게 선물)와 이어지는 소감을 추가하세요.</div>`;
      }

      html += `</section>`;

      html += `
        <div class="step-footer">
          <button type="button" class="btn btn-ghost" onclick="goStep(3)">← 스텝 3</button>
          <button type="button" class="btn btn-primary" onclick="goStep(5)">
            스텝 5 (전체 결과 & 인증서) 확인 →
          </button>
        </div>
      `;

      return html;
    }

    function toggleDrawer(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle(`hidden`);
    }

    function setQ5OX(choiceId, val) {
      appState.step4.q5.ox[choiceId] = val;
      if (val === `O`) {
        appState.step4.q5.wrongSegs[choiceId] = null;
      }
      persistState();
      renderApp();
    }

    function setQ5Seg(choiceId, segIdx) {
      appState.step4.q5.wrongSegs[choiceId] = segIdx;
      persistState();
      renderApp();
    }

    function setQ5Answer(n) {
      appState.step4.q5.answer = n;
      persistState();
      renderApp();
    }

    function setQ6OX(choiceId, val) {
      appState.step4.q6.ox[choiceId] = val;
      if (val === `O`) {
        appState.step4.q6.wrongSegs[choiceId] = null;
      }
      persistState();
      renderApp();
    }

    function setQ6Seg(choiceId, segIdx) {
      appState.step4.q6.wrongSegs[choiceId] = segIdx;
      persistState();
      renderApp();
    }

    function setQ6Answer(n) {
      appState.step4.q6.answer = n;
      persistState();
      renderApp();
    }

    function setQ7Delete(sid) {
      appState.step4.q7.deletedSentence = sid;
      persistState();
      renderApp();
    }

    function setQ7Add(aid) {
      appState.step4.q7.addedOption = aid;
      persistState();
      renderApp();
    }

    function setQ7AChoice(val) {
      appState.step4.q7.aChoice = val;
      persistState();
      renderApp();
    }

    function setQ7BChoice(val) {
      appState.step4.q7.bChoice = val;
      persistState();
      renderApp();
    }

    function setQ7Answer(n) {
      appState.step4.q7.answer = n;
      persistState();
      renderApp();
    }

    // =========================================================================
    // 10. Step 5: 결과 확인 및 100% 폭죽 인증서
    // =========================================================================
    function renderStep5(evalResult) {
      const isPerfect = evalResult.accuracy === 100;
      const stepTitles = {
        1: `STEP 1 · 지문 워밍업`,
        2: `STEP 2 · 독서 1~4번`,
        3: `STEP 3 · 소감문 워밍업`,
        4: `STEP 4 · 작문 5~7번`
      };

      let html = `
        <section class="status-card" data-status="${isPerfect ? `ok` : `warn`}">
          <div class="score-hero">
            <div>
              <span class="chip" data-status="${isPerfect ? `ok` : `warn`}">${isPerfect ? `미션 100% 완수!` : `오답 수정 및 재도전 필요`}</span>
              <h2 class="section-title" style="margin-top: var(--space-xs);">최종 수행 결과</h2>
              <p style="margin: 0; font-size: 0.92rem; color: var(--on-surface-variant);">
                전체 세부 점검 항목 ${evalResult.total}개 중 <strong>${evalResult.earned}개</strong> 통과
              </p>
            </div>
            <div class="score-number ${isPerfect ? `perfect` : ``}">${evalResult.accuracy}%</div>
          </div>
        </section>
      `;

      // Certificate when 100%
      if (isPerfect) {
        const ownerText = sessionIdentity.destroyed
          ? `(개인정보 파기 완료)`
          : `${sessionIdentity.studentId || `학번 미입력`} ${sessionIdentity.studentName || `학생`}`.trim();

        html += `
          <section class="certificate-card" aria-label="미션 완수 인증서">
            <div class="cert-inner-frame">
              <div class="cert-seal">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                  <path d="M20 6L9 17l-5-5"/>
                </svg>
                <span>정확도 100% 완수 인증서</span>
              </div>

              <div>
                <div style="font-size:0.84rem; color:var(--on-surface-variant); font-weight:700;">고등학교 국어 수업 미션 인증</div>
                <h3 class="section-title" style="margin: var(--space-xs) 0 0;">논증 읽기와 체험 소감문 고쳐쓰기</h3>
              </div>

              <div class="cert-recipient">${escapeHtml(ownerText)}</div>

              <p style="margin: 0; font-size: 0.94rem; line-height: 1.65;">
                위 학생은 복지국가의 할당 원리와 정책 결정에 관한 논증 텍스트 분석(1~4번) 및
                도자기 공예 체험 소감문 고쳐쓰기(5~7번) 전 과정을 <strong>정확도 100%</strong>로 완수하였음을 인증합니다.
              </p>

              <div class="cert-meta-row">
                <span>달성 점수: ${evalResult.earned} / ${evalResult.total} (100%)</span>
                <span>발급일: 2026년 11월 16일</span>
              </div>

              <div class="notice-box" style="margin-top: var(--space-xs);">
                학번 및 이름은 미션 완료 후 파기되며 저장되지 않습니다.
                ${!sessionIdentity.destroyed ? `
                  <div style="margin-top: var(--space-sm);">
                    <button type="button" class="btn btn-secondary" onclick="destroyStudentIdentity()">
                      인증 확인 완료 · 학번/이름 즉시 파기하기
                    </button>
                  </div>
                ` : `<div style="margin-top:var(--space-xs); color:var(--secondary);">✓ 학번 및 이름 정보가 안전하게 파기되었습니다.</div>`}
              </div>
            </div>
          </section>
        `;
      }

      // Per-step Status & Jump-back
      html += `<section class="card"><h3 class="sub-heading">스텝별 점검 및 오답 수정</h3><div style="display:flex; flex-direction:column; gap:var(--space-md);">`;

      [1, 2, 3, 4].forEach(function (sNum) {
        const issues = evalResult.issuesByStep[sNum];
        const ok = issues.length === 0;
        html += `
          <div class="status-card" data-status="${ok ? `ok` : `alert`}">
            <div class="q-header">
              <strong>${stepTitles[sNum]}</strong>
              <span class="chip" data-status="${ok ? `ok` : `alert`}">${ok ? `100% 완료` : `${issues.length}건 확인 필요`}</span>
            </div>
            ${!ok ? `
              <ul style="margin: var(--space-sm) 0; padding-left: 1.2rem; font-size: 0.88rem; color: var(--error);">
                ${issues.slice(0, 5).map(function (msg) {
                  return `<li>${escapeHtml(msg)}</li>`;
                }).join(``)}
                ${issues.length > 5 ? `<li>외 ${issues.length - 5}건 더 있음</li>` : ``}
              </ul>
              <button type="button" class="btn btn-secondary" onclick="goStep(${sNum})">
                ${sNum}단계로 이동하여 오답 수정하기
              </button>
            ` : `<p style="margin: var(--space-xs) 0 0; font-size:0.86rem; color:var(--secondary);">모든 세부 문항을 정확히 해결했습니다.</p>`}
          </div>
        `;
      });

      html += `</div></section>`;

      // Question 1~7 Summary Grid
      html += `
        <section class="card">
          <h3 class="sub-heading">문항별 정오표 (1~7번)</h3>
          <div class="option-grid">
            ${[1, 2, 3, 4, 5, 6, 7].map(function (qNum) {
              const pass = evalResult.qFlags[`q` + qNum];
              const targetStep = qNum <= 4 ? 2 : 4;
              return `
                <button type="button" class="choice-pill ${pass ? `correct` : `wrong`}" onclick="goStep(${targetStep})">
                  <span><strong>${qNum}번 문항</strong></span>
                  <span>${pass ? `통과 (O)` : `수정 필요 (→)`}</span>
                </button>
              `;
            }).join(``)}
          </div>
        </section>

        <section class="card">
          <h3 class="sub-heading">다시 도전하기</h3>
          <p style="margin:0 0 var(--space-md); font-size:0.9rem; color:var(--on-surface-variant);">
            모든 풀이 기록과 학번·이름 정보를 초기화하고 첫 화면부터 다시 시작할 수 있습니다.
          </p>
          <button type="button" id="reset-mission-btn" class="btn btn-ghost btn-block" onclick="handleResetMission(this)">
            전체 초기화하고 처음부터 다시 도전하기
          </button>
        </section>
      `;

      return html;
    }

    function destroyStudentIdentity() {
      sessionIdentity.studentId = ``;
      sessionIdentity.studentName = ``;
      sessionIdentity.destroyed = true;
      renderApp();
    }

    function handleResetMission(btn) {
      if (!btn) return;
      if (btn.dataset.armed !== `true`) {
        btn.dataset.armed = `true`;
        btn.textContent = `정말 초기화할까요? 한 번 더 터치하면 초기화됩니다`;
        return;
      }
      stopConfetti();
      sessionIdentity = { studentId: ``, studentName: ``, destroyed: false };
      appState = createInitialState();
      persistState();
      renderApp();
      window.scrollTo({ top: 0, behavior: `smooth` });
    }

    // =========================================================================
    // 11. Canvas Confetti Fireworks (for 100% Achievement)
    // =========================================================================
    function startConfetti() {
      if (window.matchMedia && window.matchMedia(`(prefers-reduced-motion: reduce)`).matches) {
        return;
      }
      const canvas = document.getElementById(`confetti-canvas`);
      if (!canvas) return;
      const ctx = canvas.getContext(`2d`);
      if (!ctx) return;

      canvas.classList.remove(`hidden`);
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const styles = getComputedStyle(document.documentElement);
      const palette = [
        styles.getPropertyValue(`--primary`).trim() || `#0f7c8a`,
        styles.getPropertyValue(`--tertiary`).trim() || `#2e7d4f`,
        styles.getPropertyValue(`--data-3`).trim() || `#b86e00`,
        styles.getPropertyValue(`--data-4`).trim() || `#5c5fb0`,
        styles.getPropertyValue(`--error`).trim() || `#b3261e`
      ];

      const particles = [];
      const count = 90;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height * 0.6,
          vx: (Math.random() - 0.5) * 4,
          vy: 2.5 + Math.random() * 4,
          size: 6 + Math.random() * 6,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.2,
          color: palette[i % palette.length]
        });
      }

      cancelAnimationFrame(confettiAnimId);
      const startTime = performance.now();

      function tick(now) {
        const elapsed = now - startTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let alive = false;
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          if (p.y < canvas.height + 30) {
            alive = true;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size * 0.5);
          ctx.restore();
        }

        if (alive && elapsed < 4500) {
          confettiAnimId = requestAnimationFrame(tick);
        } else {
          stopConfetti();
        }
      }

      confettiAnimId = requestAnimationFrame(tick);
    }

    function stopConfetti() {
      cancelAnimationFrame(confettiAnimId);
      const canvas = document.getElementById(`confetti-canvas`);
      if (canvas) {
        const ctx = canvas.getContext(`2d`);
        if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.classList.add(`hidden`);
      }
    }

    // =========================================================================
    // 12. Bootstrap with notebookAppApi
    // =========================================================================
    async function initApp() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
          const saved = await window.notebookAppApi.getAppState();
          if (saved && typeof saved === `object` && saved.step1 && saved.step2 && saved.step3 && saved.step4) {
            appState = saved;
          }
        }
      } catch (e) {
        // Fallback to fresh initial state
      }

      renderApp();

      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
          window.notebookAppApi.notifyAppReady();
        }
      } catch (e) {
        // Safe ignore
      }
    }

    initApp();
  </script>
</body>
</html>
